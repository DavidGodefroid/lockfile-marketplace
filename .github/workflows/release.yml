name: release

# A maintainer pushes a tag <plugin>/vX.Y.Z. This workflow tests and builds
# that plugin from the tagged source, signs every artifact with cosign
# keyless (the identity lockfile trusts is this file on a tag ref), publishes
# a GitHub release, then rebuilds index.json from all releases and signs it.
# pages.yml deploys the signed index.
#
# To re-sign the index alone (after marking a release "[yanked] ..."), run
# this workflow by hand on a tag ref: on a branch ref the signature would not
# match the identity lockfile pins, and the index job refuses to publish it.
on:
  push:
    tags: ["*/v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  IDENTITY: '^https://github\.com/DavidGodefroid/lockfile-marketplace/\.github/workflows/release\.yml@refs/tags/'
  ISSUER: https://token.actions.githubusercontent.com

jobs:
  plugin:
    name: build, sign and release the plugin
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
      id-token: write # cosign keyless signing (GitHub OIDC)
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # previous tags of the plugin, for the question check
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: sigstore/cosign-installer@v3
      - name: tag, version and question checks
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          name="${TAG%/v*}"
          version="${TAG##*/v}"
          dir="plugins/$name"
          test -f "$dir/plugin.toml" || { echo "::error::no plugin $name"; exit 1; }
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::$version is not X.Y.Z"; exit 1; }
          got=$(sed -n 's/^version *= *"\(.*\)"$/\1/p' "$dir/plugin.toml")
          [ "$got" = "$version" ] || { echo "::error::plugin.toml says $got, the tag $version"; exit 1; }
          # A changed question, or meaning of 1 or 0, is a new major version.
          prev=$(git tag -l "$name/v*" --sort=-v:refname | grep -vxF "$TAG" | head -n 1 || true)
          if [ -n "$prev" ]; then
            q() { git show "$1:$dir/plugin.toml" | grep -E '^(question|one|zero) *=' || true; }
            if [ "$(q "$prev")" != "$(q "$TAG")" ]; then
              pm="${prev##*/v}"; pm="${pm%%.*}"; nm="${version%%.*}"
              [ "$nm" -gt "$pm" ] || { echo "::error::question, one or zero changed since $prev: needs a new major version"; exit 1; }
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: test the plugin
        working-directory: plugins/${{ steps.meta.outputs.name }}
        run: go test ./...
      - name: build
        shell: bash
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${p%/*}"; arch="${p#*/}"
            (cd "plugins/$NAME" && GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -buildid=" -o "../../dist/$NAME-$VERSION-$os-$arch" .)
          done
          cp "plugins/$NAME/plugin.toml" dist/plugin.toml
      - name: sign
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$f"
          done
      - name: checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS dist/SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "$NAME $VERSION" \
            --notes "Built from \`$TAG\` by release.yml, signed with cosign keyless. Install with \`lockfile plugin install $NAME@$VERSION\`."

  index:
    name: build and sign index.json
    needs: plugin
    if: always() && (needs.plugin.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: refuse a branch ref
        if: github.ref_type != 'tag'
        run: |
          echo "::error::run on a tag ref: the index signature must match release.yml@refs/tags/"
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: sigstore/cosign-installer@v3
      - name: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > releases.json
      - name: index.json
        working-directory: cmd/indexgen
        run: go run . -releases ../../releases.json -out ../../index/index.json
      - name: sign
        run: |
          cosign sign-blob --yes --bundle index/index.json.sigstore.json index/index.json
          cosign verify-blob --bundle index/index.json.sigstore.json --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" index/index.json
      - uses: actions/upload-artifact@v5
        with:
          name: index
          path: index/
          if-no-files-found: error
