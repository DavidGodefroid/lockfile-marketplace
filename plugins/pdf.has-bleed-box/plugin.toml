name = "pdf.has-bleed-box"
version = "1.0.0"
protocol = 1
question = "Does the PDF have at least one page with a /BleedBox?"
one  = "at least one page dictionary has a /BleedBox"
zero = "no page dictionary has a /BleedBox"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
