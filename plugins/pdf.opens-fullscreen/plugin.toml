name = "pdf.opens-fullscreen"
version = "1.0.0"
protocol = 1
question = "Does the PDF ask the viewer to open in full-screen mode?"
one  = "the catalog /PageMode is the name /FullScreen"
zero = "the catalog /PageMode is another name, or is absent"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
