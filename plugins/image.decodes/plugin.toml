name = "image.decodes"
version = "1.0.0"
protocol = 1
question = "Does the file decode as a PNG or JPEG image?"
one = "the file is a PNG or a JPEG image that decodes completely without error"
zero = "the file is not a PNG or a JPEG (GIF and every other format included), or it is a PNG or JPEG that fails to decode, for example because it is truncated or corrupt"
accepts = ["*/*"]
limits = { cpu_s = 20, memory = "1GiB", timeout_s = 30 }
