name = "zip.uses-zip64"
version = "1.0.0"
protocol = 1
question = "Does the ZIP archive use the ZIP64 extensions?"
one = "a zip64 end of central directory locator precedes the end of central directory record, or an entry has a zip64 extended information extra field (0x0001)"
zero = "no zip64 locator and no entry with a zip64 extra field"
accepts = ["application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
