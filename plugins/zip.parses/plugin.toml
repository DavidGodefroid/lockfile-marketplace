name = "zip.parses"
version = "1.0.0"
protocol = 1
question = "Does the file read as a complete, unencrypted ZIP archive?"
one = "the central directory reads and every entry is unencrypted and decompresses with a matching CRC-32"
zero = "not a ZIP archive, an encrypted entry, or an entry that fails to decompress or check"
accepts = ["*/*"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
