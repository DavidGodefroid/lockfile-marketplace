name = "pdf.has-incremental-update"
version = "1.0.0"
protocol = 1
question = "Was the PDF modified by at least one incremental update after its first save?"
one  = "the cross-reference chain (startxref, then each /Prev) has more than one section, not counting a linearization first-page section or hybrid /XRefStm streams"
zero = "a single cross-reference section"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
