name = "zip.has-nested-archive"
version = "1.0.0"
protocol = 1
question = "Does the ZIP archive contain an entry that is itself an archive or a compressed stream?"
one = "a file entry starts with the signature of a zip, gzip, bzip2, xz, zstd, 7z, rar or tar archive"
zero = "no file entry starts with an archive or compressed-stream signature"
accepts = ["application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
