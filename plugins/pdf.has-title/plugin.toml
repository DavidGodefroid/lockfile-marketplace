name = "pdf.has-title"
version = "1.0.0"
protocol = 1
question = "Does the PDF have a document title in its metadata?"
one  = "the document information dictionary has a non-empty /Title, or the catalog XMP has a dc:title property; the title is never read beyond being empty or not"
zero = "no non-empty /Title and no dc:title in the catalog XMP"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
