name = "pdf.has-lzw-stream"
version = "1.0.0"
protocol = 1
question = "Does the PDF have an LZW-compressed stream?"
one  = "some stream dictionary has a /Filter (a name or an array) that includes /LZWDecode, a filter PDF/A forbids"
zero = "no stream dictionary lists /LZWDecode in its /Filter"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
