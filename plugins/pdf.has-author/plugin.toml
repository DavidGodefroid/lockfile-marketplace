name = "pdf.has-author"
version = "1.0.0"
protocol = 1
question = "Does the PDF name an author in its metadata?"
one  = "the document information dictionary has a non-empty /Author, or the catalog XMP has a dc:creator property; the author is never read beyond being empty or not"
zero = "no non-empty /Author and no dc:creator in the catalog XMP"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
