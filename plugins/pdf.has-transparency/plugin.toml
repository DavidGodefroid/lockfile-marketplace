name = "pdf.has-transparency"
version = "1.0.0"
protocol = 1
question = "Does the PDF use transparency?"
one  = "an ExtGState has a soft mask other than /None, a /CA or /ca below 1, or a blend mode other than Normal/Compatible, or an image has an /SMask"
zero = "no transparent graphics state and no soft-masked image"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
