name = "pdf.has-public-key-encryption"
version = "1.0.0"
protocol = 1
question = "Is the PDF encrypted with a public-key security handler?"
one  = "the PDF is encrypted and its /Encrypt /Filter names a handler other than /Standard (for example /Adobe.PubSec)"
zero = "the PDF is not encrypted, or it is encrypted with the /Standard password security handler"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
