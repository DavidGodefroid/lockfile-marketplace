name = "pdf.claims-pdfa"
version = "1.0.0"
protocol = 1
question = "Does the PDF declare PDF/A conformance in its XMP metadata?"
one  = "the catalog /Metadata XMP contains a pdfaid:part property (namespace http://www.aiim.org/pdfa/ns/id/); conformance itself is not checked"
zero = "no catalog XMP metadata, or no pdfaid:part property in it"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
