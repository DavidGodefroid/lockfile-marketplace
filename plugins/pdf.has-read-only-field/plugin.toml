name = "pdf.has-read-only-field"
version = "1.0.0"
protocol = 1
question = "Does the PDF have a read-only form field?"
one  = "some node of the AcroForm field tree sets the ReadOnly flag (bit 1 of /Ff)"
zero = "no such field (no form, an empty field tree, or no field with the ReadOnly flag)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
