name = "pdf.has-external-link"
version = "1.0.0"
protocol = 1
question = "Does the PDF link outside itself, to a URI or to another file?"
one  = "some object is a URI action (/S /URI) or a remote go-to action (/S /GoToR)"
zero = "no URI action and no remote go-to action (links inside the document do not count)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
