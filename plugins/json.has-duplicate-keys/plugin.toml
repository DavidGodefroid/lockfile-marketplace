name = "json.has-duplicate-keys"
version = "1.0.0"
protocol = 1
question = "Does some JSON object in the file repeat a key?"
one = "the file holds exactly one JSON value and some object in it has the same key (after unescaping) twice"
zero = "the file holds exactly one JSON value and no object in it repeats a key"
accepts = ["*/*"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
