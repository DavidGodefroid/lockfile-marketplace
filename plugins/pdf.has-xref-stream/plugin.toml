name = "pdf.has-xref-stream"
version = "1.0.0"
protocol = 1
question = "Does the PDF use cross-reference streams?"
one  = "at least one section of the cross-reference chain (startxref, then each /Prev) is a cross-reference stream; the /XRefStm of a hybrid file does not count"
zero = "every section is a classic xref table"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
