name = "image.is-animated"
version = "1.0.0"
protocol = 1
question = "Is the PNG, GIF or JPEG image animated?"
one = "a GIF with more than one frame, or a PNG with an acTL (animated PNG) chunk"
zero = "a single-frame GIF, a PNG without an acTL chunk, or a JPEG"
accepts = ["*/*"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
