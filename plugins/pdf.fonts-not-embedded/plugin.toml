name = "pdf.fonts-not-embedded"
version = "1.0.0"
protocol = 1
question = "Does the PDF use at least one font that is not embedded?"
one = "a used font has no FontFile, FontFile2 or FontFile3"
zero = "every used font is embedded (standard 14 fonts count as not embedded)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
