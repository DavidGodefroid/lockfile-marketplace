name = "pdf.has-creator-tool"
version = "1.0.0"
protocol = 1
question = "Does the PDF name the tool that created it in its metadata?"
one  = "the document information dictionary has a non-empty /Creator, or the catalog XMP has an xmp:CreatorTool property; the tool name is never read beyond being empty or not"
zero = "no non-empty /Creator and no xmp:CreatorTool in the catalog XMP"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
