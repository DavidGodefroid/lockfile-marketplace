name = "pdf.has-creation-date"
version = "1.0.0"
protocol = 1
question = "Does the PDF record a creation date in its metadata?"
one  = "the document information dictionary has a non-empty /CreationDate, or the catalog XMP has an xmp:CreateDate property; the date is never read beyond being empty or not"
zero = "no non-empty /CreationDate and no xmp:CreateDate in the catalog XMP"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
