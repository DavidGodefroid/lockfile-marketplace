name = "pdf.has-launch-action"
version = "1.0.0"
protocol = 1
question = "Does the PDF contain a launch action (one that starts an application or opens a file)?"
one  = "some object is a launch action (/S /Launch)"
zero = "no launch action"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
