name = "pdf.has-output-intent"
version = "1.0.0"
protocol = 1
question = "Does the PDF have an output intent?"
one  = "the catalog /OutputIntents array has at least one dictionary; the ICC profile is not checked"
zero = "no /OutputIntents in the catalog, or an empty array"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
