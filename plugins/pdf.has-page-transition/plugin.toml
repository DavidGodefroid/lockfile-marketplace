name = "pdf.has-page-transition"
version = "1.0.0"
protocol = 1
question = "Does the PDF define a presentation transition or display duration for at least one page?"
one  = "at least one page dictionary has a non-null /Trans or /Dur entry"
zero = "no page dictionary has a /Trans or /Dur entry"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
