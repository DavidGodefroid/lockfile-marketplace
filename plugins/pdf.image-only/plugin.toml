name = "pdf.image-only"
version = "1.0.0"
protocol = 1
question = "Does every page of the PDF draw an image, in its content or a form XObject it draws, with no page showing text?"
one  = "every page draws an image and no page has a text-showing operator"
zero = "some page draws no image, or some page shows text (invisible OCR text included)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
