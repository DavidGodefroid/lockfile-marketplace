name = "pdf.has-page-labels"
version = "1.0.0"
protocol = 1
question = "Does the PDF define page labels?"
one  = "the catalog has a /PageLabels number tree; the labels themselves are not read"
zero = "the catalog has no /PageLabels entry"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
