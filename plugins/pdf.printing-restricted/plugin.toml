name = "pdf.printing-restricted"
version = "1.0.0"
protocol = 1
question = "Does the PDF forbid printing?"
one  = "the PDF is encrypted and its /P permissions clear bit 3 (print)"
zero = "the PDF is not encrypted, or its /P permissions set bit 3 (print)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
