name = "pdf.uses-aes256-encryption"
version = "1.0.0"
protocol = 1
question = "Is the PDF encrypted with AES-256 (PDF 2.0, revision 6 or later)?"
one  = "the /Encrypt dictionary has /V 5, /R 6 or more, and its stream and string crypt filters use /CFM /AESV3"
zero = "the PDF is not encrypted, or uses a weaker or older scheme (RC4, AES-128, revision 5, an Identity filter)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
