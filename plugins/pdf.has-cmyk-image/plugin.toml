name = "pdf.has-cmyk-image"
version = "1.0.0"
protocol = 1
question = "Does the PDF have a CMYK image?"
one  = "some image XObject has a /ColorSpace that is /DeviceCMYK, or /ICCBased with a four-component profile (/N 4)"
zero = "no image XObject has a /DeviceCMYK or four-component /ICCBased colour space"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
