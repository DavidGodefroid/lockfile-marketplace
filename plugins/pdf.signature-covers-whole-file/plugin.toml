name = "pdf.signature-covers-whole-file"
version = "1.0.0"
protocol = 1
question = "Does a signature cover the whole file?"
one  = "some signature value (as pdf.has-signature finds it) has a /ByteRange [0 b c d] with b < c and c + d equal to the file size: nothing was appended after signing; the signature is not verified"
zero = "the PDF is unsigned, or no signature's byte range reaches the end of the file (an incremental update or other bytes were added after signing)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
