name = "pdf.has-mixed-orientation"
version = "1.0.0"
protocol = 1
question = "Does the PDF mix portrait and landscape pages?"
one  = "at least one page is displayed portrait and another landscape, from its visible box and its effective /Rotate; square pages count as neither"
zero = "all non-square pages are displayed in the same orientation"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
