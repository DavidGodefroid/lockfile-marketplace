name = "pdf.has-markup-annotation"
version = "1.0.0"
protocol = 1
question = "Does some page carry a markup annotation (a comment, highlight, stamp, drawing...)?"
one  = "some page's /Annots holds a markup annotation (Text, FreeText, Line, Square, Circle, Polygon, PolyLine, Highlight, Underline, Squiggly, StrikeOut, Stamp, Caret, Ink, FileAttachment, Sound, Redact or Projection)"
zero = "no page lists a markup annotation (Link, Widget, Popup and other non-markup annotations do not count)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
