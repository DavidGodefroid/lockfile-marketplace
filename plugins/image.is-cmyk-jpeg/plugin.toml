name = "image.is-cmyk-jpeg"
version = "1.0.0"
protocol = 1
question = "Is the file a CMYK JPEG?"
one = "a JPEG whose frame header declares four colour components (CMYK or YCCK), which image/jpeg reports as the CMYK colour model"
zero = "a JPEG with one (grayscale) or three (YCbCr or RGB) colour components"
accepts = ["*/*"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
