name = "pdf.needs-appearances"
version = "1.0.0"
protocol = 1
question = "Does the PDF ask the viewer to regenerate its form field appearances?"
one  = "the catalog's /AcroForm dictionary has /NeedAppearances true: the drawn field appearances may be missing or stale, so viewers redraw them"
zero = "no /AcroForm, or an /AcroForm whose /NeedAppearances is absent or false"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
