name = "pdf.has-redaction-annotation"
version = "1.0.0"
protocol = 1
question = "Does some page carry a redaction annotation (content marked for redaction but not yet removed)?"
one  = "some page's /Annots holds an annotation of subtype /Redact"
zero = "no page lists a /Redact annotation (other annotation subtypes do not count)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
