name = "json.nesting-over-64"
version = "1.0.0"
protocol = 1
question = "Does the JSON value nest arrays and objects more than 64 levels deep?"
one = "the file holds one well-formed JSON value whose array/object nesting depth is greater than 64"
zero = "the file holds one well-formed JSON value whose array/object nesting depth is 64 or less (a scalar has depth 0)"
accepts = ["*/*"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
