name = "pdf.has-image"
version = "1.0.0"
protocol = 1
question = "Does some page of the PDF draw an image, in its content or a form XObject it draws?"
one  = "some page draws an image XObject (Do) or an inline image (BI)"
zero = "no page draws an image"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
