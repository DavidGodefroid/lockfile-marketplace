name = "json.parses"
version = "1.0.0"
protocol = 1
question = "Does the file parse as exactly one JSON value?"
one = "the file is valid UTF-8 without a BOM and holds exactly one well-formed JSON value, surrounded only by whitespace"
zero = "an empty or whitespace-only file, a BOM, invalid UTF-8, a syntax error, a truncated value, or data after the first value"
accepts = ["*/*"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
