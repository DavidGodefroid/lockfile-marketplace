name = "pdf.has-3d-annotation"
version = "1.0.0"
protocol = 1
question = "Does some page carry a 3D annotation (an embedded 3D model)?"
one  = "some page's /Annots holds an annotation of subtype 3D"
zero = "no page lists an annotation of subtype 3D"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
