name = "pdf.copying-restricted"
version = "1.0.0"
protocol = 1
question = "Does the PDF forbid copying its text and graphics?"
one  = "the PDF is encrypted and its /P permissions clear bit 5 (copy or extract text and graphics)"
zero = "the PDF is not encrypted, or its /P permissions set bit 5 (copy or extract text and graphics)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
