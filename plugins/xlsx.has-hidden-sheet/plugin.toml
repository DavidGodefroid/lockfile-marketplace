name = "xlsx.has-hidden-sheet"
version = "1.0.0"
protocol = 1
question = "Does the Excel workbook contain a hidden sheet?"
one = "a sheet in the workbook part has state=\"hidden\" or state=\"veryHidden\""
zero = "no sheet in the workbook part is hidden"
accepts = ["application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
