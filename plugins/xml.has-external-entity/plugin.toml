name = "xml.has-external-entity"
version = "1.0.0"
protocol = 1
question = "Does the XML document's DOCTYPE declare an external entity?"
one = "the internal subset of the DOCTYPE declares an entity, general or parameter, with a SYSTEM or PUBLIC identifier (the XXE shape)"
zero = "no DOCTYPE, or a DOCTYPE whose internal subset declares no entity or only internal ones; a DOCTYPE's own external DTD does not count"
accepts = ["*/*"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
