name = "pdf.has-mixed-page-sizes"
version = "1.0.0"
protocol = 1
question = "Does the PDF have pages of different sizes?"
one  = "at least one page's visible box (crop box clipped to the media box, scaled by UserUnit) differs from the first page's by more than 1 mm on a side, orientation ignored"
zero = "every page has the first page's size within 1 mm, orientation ignored, or there is one page"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
