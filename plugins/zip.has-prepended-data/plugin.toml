name = "zip.has-prepended-data"
version = "1.0.0"
protocol = 1
question = "Does the ZIP archive have data before its first record?"
one = "the file parses as a ZIP archive but does not start with a local file header (or, for an archive without entries, with its end of central directory record)"
zero = "the file starts with a local file header, or is an archive without entries that starts with its end of central directory record"
accepts = ["application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
