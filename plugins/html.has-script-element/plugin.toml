name = "html.has-script-element"
version = "1.0.0"
protocol = 1
question = "Does the file contain an HTML script start tag?"
one = "a case-insensitive \"<script\" followed by whitespace, '/' or '>' appears anywhere in the file, comments included"
zero = "no such tag: \"<script\" followed by another character or ending the file, and on* event attributes, do not count"
accepts = ["*/*"]
limits = { cpu_s = 10, memory = "128MiB", timeout_s = 20 }
