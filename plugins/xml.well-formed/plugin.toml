name = "xml.well-formed"
version = "1.0.0"
protocol = 1
question = "Is the file a well-formed XML document?"
one = "the file parses as strict XML (UTF-8, US-ASCII or ISO-8859-1) with exactly one root element, only whitespace outside it, directives only before it and the XML declaration only at the very start"
zero = "an empty file, a syntax error, invalid UTF-8, an undefined entity, an unsupported encoding, no or several root elements, text outside the root, a directive after the root or a misplaced XML declaration"
accepts = ["*/*"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
