name = "pdf.annotations-lack-tab-order"
version = "1.0.0"
protocol = 1
question = "Does some page with annotations lack the structure tab order (/Tabs /S) PDF/UA requires?"
one  = "some page whose /Annots lists at least one annotation has no /Tabs /S (absent, or another tab order such as /R or /C)"
zero = "every page that lists an annotation has /Tabs /S, or no page lists any annotation"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
