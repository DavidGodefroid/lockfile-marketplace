name = "pdf.has-type3-font"
version = "1.0.0"
protocol = 1
question = "Does the PDF contain a Type 3 font?"
one  = "some object of the file is a font dictionary of subtype Type3 (/Type /Font /Subtype /Type3: glyphs drawn by content streams)"
zero = "no font dictionary of subtype Type3 anywhere in the file"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
