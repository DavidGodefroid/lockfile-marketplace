name = "zip.has-comment"
version = "1.0.0"
protocol = 1
question = "Does the ZIP archive have a comment?"
one = "the archive comment in the end-of-central-directory record is non-empty"
zero = "the archive comment is empty"
accepts = ["application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
