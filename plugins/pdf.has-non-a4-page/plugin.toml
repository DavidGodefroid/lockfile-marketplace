name = "pdf.has-non-a4-page"
version = "1.0.0"
protocol = 1
question = "Does the PDF have at least one page whose visible size is not A4?"
one  = "at least one page's crop box (clipped to its media box, scaled by UserUnit) differs from 210 x 297 mm, portrait or landscape, by more than 1 mm on a side"
zero = "every page is A4 within 1 mm, portrait or landscape"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
