name = "pdf.has-page-larger-than-a3"
version = "1.0.0"
protocol = 1
question = "Does the PDF have at least one page whose visible size exceeds A3?"
one  = "at least one page's crop box (clipped to its media box, scaled by UserUnit) has a side longer than 420 mm + 1 mm, or both sides longer than 297 mm + 1 mm, portrait or landscape"
zero = "every page fits within A3 (297 x 420 mm) plus 1 mm on a side, portrait or landscape"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
