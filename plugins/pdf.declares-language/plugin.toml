name = "pdf.declares-language"
version = "1.0.0"
protocol = 1
question = "Does the PDF declare a document language?"
one  = "the catalog has a non-empty /Lang string; its value is not read"
zero = "no /Lang in the catalog, or an empty one"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
