name = "pdf.has-subject"
version = "1.0.0"
protocol = 1
question = "Does the PDF have a document subject in its metadata?"
one  = "the document information dictionary has a non-empty /Subject, or the catalog XMP has a dc:description property; the subject is never read beyond being empty or not"
zero = "no non-empty /Subject and no dc:description in the catalog XMP"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
