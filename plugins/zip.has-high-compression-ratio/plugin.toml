name = "zip.has-high-compression-ratio"
version = "1.0.0"
protocol = 1
question = "Does the ZIP archive have an entry whose uncompressed size is more than 100 times its compressed size?"
one = "an entry's central-directory sizes give an uncompressed/compressed ratio above 100 (zip-bomb shape)"
zero = "every entry's uncompressed size is at most 100 times its compressed size"
accepts = ["application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
