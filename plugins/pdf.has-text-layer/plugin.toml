name = "pdf.has-text-layer"
version = "1.0.0"
protocol = 1
question = "Does some page of the PDF show text, in its content or a form XObject it draws, visible or not?"
one  = "some page has a text-showing operator (Tj, TJ, ' or \"), invisible OCR text included"
zero = "no page shows text"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
