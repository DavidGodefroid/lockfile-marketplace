name = "pdf.has-required-field"
version = "1.0.0"
protocol = 1
question = "Does the PDF have a required form field?"
one  = "some node of the AcroForm field tree has bit 2 (Required) set in its field flags (/Ff)"
zero = "no such field (no form, an empty field tree, or no field flagged Required)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
