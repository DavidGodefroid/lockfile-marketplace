name = "pdf.has-javascript"
version = "1.0.0"
protocol = 1
question = "Does the PDF contain JavaScript?"
one  = "some object is a JavaScript action (/S /JavaScript) or has a /JS entry, or the catalog has a /Names /JavaScript tree"
zero = "no JavaScript action, /JS entry or JavaScript name tree"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
