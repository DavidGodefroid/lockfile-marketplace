name = "zip.has-encrypted-entry"
version = "1.0.0"
protocol = 1
question = "Does the ZIP archive have an encrypted entry?"
one = "an entry has the encryption flag (general purpose bit 0) set or uses the AES method (99)"
zero = "no entry has the encryption flag set or uses the AES method"
accepts = ["application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
