name = "pdf.has-xfa"
version = "1.0.0"
protocol = 1
question = "Does the PDF carry an XFA form?"
one  = "the catalog's /AcroForm dictionary has an /XFA entry (a stream or an array of packets); static and dynamic XFA alike, the XML is not read"
zero = "no /AcroForm, or an /AcroForm without /XFA (a plain AcroForm form)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
