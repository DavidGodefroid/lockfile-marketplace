name = "ooxml.has-thumbnail"
version = "1.0.0"
protocol = 1
question = "Does the Office Open XML package carry a thumbnail?"
one = "the package root relationships have a thumbnail relationship whose target is a part of the package"
zero = "the package root relationships have no thumbnail relationship to an existing part"
accepts = ["application/zip", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
