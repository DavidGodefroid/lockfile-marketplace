name = "docx.has-document-protection"
version = "1.0.0"
protocol = 1
question = "Does the Word document declare document protection?"
one = "the settings part of the Word main document has a WordprocessingML documentProtection element"
zero = "the Word main document has no settings part, or its settings part has no WordprocessingML documentProtection element"
accepts = ["application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
