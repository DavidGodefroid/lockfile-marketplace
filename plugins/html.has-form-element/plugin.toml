name = "html.has-form-element"
version = "1.0.0"
protocol = 1
question = "Does the file contain an HTML form start tag?"
one = "a case-insensitive \"<form\" followed by whitespace, '/' or '>' appears anywhere in the file, comments included"
zero = "no such tag: \"<form\" followed by another character or ending the file, and form-related attributes, do not count"
accepts = ["*/*"]
limits = { cpu_s = 10, memory = "128MiB", timeout_s = 20 }
