name = "pdf.has-ccitt-image"
version = "1.0.0"
protocol = 1
question = "Does the PDF hold a CCITT fax-encoded stream (a fax or scanned bilevel image)?"
one  = "some stream object's /Filter is /CCITTFaxDecode or an array that includes it"
zero = "no stream object has /CCITTFaxDecode in its /Filter (inline images inside content streams are not read)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
