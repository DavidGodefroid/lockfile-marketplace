name = "pdf.has-piece-info"
version = "1.0.0"
protocol = 1
question = "Does the document carry private application data (/PieceInfo)?"
one  = "the catalog or some page of the page tree has a /PieceInfo dictionary (its content is never read)"
zero = "neither the catalog nor any page has a /PieceInfo dictionary (a null /PieceInfo counts as absent)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
