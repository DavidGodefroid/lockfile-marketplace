name = "docx.has-field-codes"
version = "1.0.0"
protocol = 1
question = "Does the Word document contain field codes?"
one = "word/document.xml has a WordprocessingML fldSimple or instrText element"
zero = "word/document.xml has no WordprocessingML fldSimple or instrText element (other parts are not read)"
accepts = ["application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
