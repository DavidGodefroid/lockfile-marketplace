name = "pdf.has-trailing-data"
version = "1.0.0"
protocol = 1
question = "Does the PDF have data after its last %%EOF?"
one = "bytes other than whitespace follow the last %%EOF"
zero = "only whitespace, or nothing, follows the last %%EOF"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
