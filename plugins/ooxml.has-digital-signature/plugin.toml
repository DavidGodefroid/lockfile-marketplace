name = "ooxml.has-digital-signature"
version = "1.0.0"
protocol = 1
question = "Is the Office Open XML package digitally signed?"
one = "the package root has a digital-signature origin relationship whose origin part links at least one existing signature part"
zero = "the package has no digital-signature origin, or its origin links no existing signature part"
accepts = ["application/zip", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
