name = "pdf.has-producer"
version = "1.0.0"
protocol = 1
question = "Does the PDF name its producing software in its metadata?"
one  = "the document information dictionary has a non-empty /Producer, or the catalog XMP has a pdf:Producer property; the producer is never read beyond being empty or not"
zero = "no non-empty /Producer and no pdf:Producer in the catalog XMP"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
