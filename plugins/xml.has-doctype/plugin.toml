name = "xml.has-doctype"
version = "1.0.0"
protocol = 1
question = "Does the XML document have a DOCTYPE declaration?"
one = "the document is well-formed XML and its prolog holds a <!DOCTYPE declaration"
zero = "the document is well-formed XML without a DOCTYPE declaration"
accepts = ["*/*"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
