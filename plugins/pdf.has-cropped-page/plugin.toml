name = "pdf.has-cropped-page"
version = "1.0.0"
protocol = 1
question = "Does the PDF have at least one page whose CropBox differs from its MediaBox by more than 1 mm on any edge?"
one  = "at least one page's effective CropBox (inherited from the page tree, clipped to the MediaBox) moves an edge of the MediaBox by more than 1 mm, after /UserUnit scaling"
zero = "no page has a CropBox, or every CropBox matches its MediaBox within 1 mm on each edge (a CropBox larger than the MediaBox counts as matching)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
