name = "docx.has-embedded-object"
version = "1.0.0"
protocol = 1
question = "Does the Word document embed an object?"
one = "the main document part has an internal oleObject or package relationship"
zero = "the main document part has no internal oleObject or package relationship (linked objects are not embedded)"
accepts = ["application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
