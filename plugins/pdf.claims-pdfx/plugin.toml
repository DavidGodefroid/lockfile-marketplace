name = "pdf.claims-pdfx"
version = "1.0.0"
protocol = 1
question = "Does the PDF declare PDF/X conformance?"
one  = "the document information dictionary has /GTS_PDFXVersion, or the catalog XMP has a pdfxid:GTS_PDFXVersion property (namespace http://www.npes.org/pdfx/ns/id/); conformance itself is not checked"
zero = "neither"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
