name = "zip.has-symlink-entry"
version = "1.0.0"
protocol = 1
question = "Does the ZIP archive have a symbolic-link entry?"
one = "an entry's mode (Unix external attributes) is a symbolic link"
zero = "no entry's mode is a symbolic link"
accepts = ["application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
