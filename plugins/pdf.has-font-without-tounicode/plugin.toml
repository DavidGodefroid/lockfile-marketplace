name = "pdf.has-font-without-tounicode"
version = "1.0.0"
protocol = 1
question = "Does the PDF have a font whose text cannot be mapped to Unicode?"
one = "a Type0 font, or a simple font without a standard encoding, has no ToUnicode map"
zero = "every font has a ToUnicode map or a standard encoding"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
