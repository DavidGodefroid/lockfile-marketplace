name = "pdf.has-associated-files"
version = "1.0.0"
protocol = 1
question = "Does the PDF declare associated files?"
one  = "the catalog /AF array (PDF/A-3 associated files) has at least one entry; the files are not read"
zero = "no /AF in the catalog, or an empty array"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
