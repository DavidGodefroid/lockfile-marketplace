name = "ooxml.has-macros"
version = "1.0.0"
protocol = 1
question = "Does the Office Open XML package contain macros?"
one = "a part in the package has the content type application/vnd.ms-office.vbaProject, a macrosheet content type, or the name vbaProject.bin"
zero = "no part in the package is a VBA project or a macro sheet"
accepts = ["application/zip", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
