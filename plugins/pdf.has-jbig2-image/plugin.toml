name = "pdf.has-jbig2-image"
version = "1.0.0"
protocol = 1
question = "Does the PDF hold a JBIG2-compressed stream (typically a scanned bi-level image)?"
one  = "some stream's /Filter, a name or an array of names, includes /JBIG2Decode"
zero = "no stream declares the /JBIG2Decode filter (stream data is never decoded)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
