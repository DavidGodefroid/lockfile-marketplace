name = "pdf.has-multimedia-annotation"
version = "1.0.0"
protocol = 1
question = "Does some page carry a multimedia annotation (embedded video, sound or rich media)?"
one  = "some page's /Annots holds a Screen, Movie, Sound or RichMedia annotation"
zero = "no page lists a Screen, Movie, Sound or RichMedia annotation (other annotations, and annotations no page lists, do not count)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
