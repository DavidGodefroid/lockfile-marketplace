name = "pdf.text-on-every-page"
version = "1.0.0"
protocol = 1
question = "Does every page of the PDF show text, in its content or a form XObject it draws, visible or not?"
one  = "every page has a text-showing operator (Tj, TJ, ' or \"), invisible OCR text included"
zero = "some page shows no text"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
