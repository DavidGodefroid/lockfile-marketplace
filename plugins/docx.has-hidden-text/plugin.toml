name = "docx.has-hidden-text"
version = "1.0.0"
protocol = 1
question = "Does the Word document contain hidden text?"
one = "word/document.xml has a WordprocessingML vanish element that is not turned off by its val attribute"
zero = "word/document.xml has no such vanish element (styles and other parts are not read)"
accepts = ["application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
