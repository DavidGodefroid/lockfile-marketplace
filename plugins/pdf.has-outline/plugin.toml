name = "pdf.has-outline"
version = "1.0.0"
protocol = 1
question = "Does the PDF have an outline (bookmarks)?"
one  = "the catalog /Outlines dictionary has a /First item; item titles are not read"
zero = "no /Outlines, or an outline without any item"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
