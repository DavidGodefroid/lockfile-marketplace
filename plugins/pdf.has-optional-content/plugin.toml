name = "pdf.has-optional-content"
version = "1.0.0"
protocol = 1
question = "Does the PDF have optional content (layers)?"
one  = "the catalog /OCProperties dictionary has a non-empty /OCGs array; layer names are not read"
zero = "no /OCProperties in the catalog, or an empty /OCGs array"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
