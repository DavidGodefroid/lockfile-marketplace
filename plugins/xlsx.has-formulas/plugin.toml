name = "xlsx.has-formulas"
version = "1.0.0"
protocol = 1
question = "Does the Excel workbook contain formulas?"
one = "a worksheet part of the workbook has a SpreadsheetML f (cell formula) element"
zero = "no worksheet part of the workbook has a SpreadsheetML f element"
accepts = ["application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
