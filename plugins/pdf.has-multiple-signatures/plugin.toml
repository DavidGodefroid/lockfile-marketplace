name = "pdf.has-multiple-signatures"
version = "1.0.0"
protocol = 1
question = "Does the PDF carry two or more digital signatures?"
one  = "at least two signature fields (/FT /Sig, inherited) of the AcroForm field tree have a value with a /ByteRange and a /Contents; document time stamps count; no signature is verified"
zero = "zero or one such signature value (no form, no signature field, empty signature fields, or a single signature)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
