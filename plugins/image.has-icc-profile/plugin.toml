name = "image.has-icc-profile"
version = "1.0.0"
protocol = 1
question = "Does the PNG or JPEG image embed an ICC colour profile?"
one = "a PNG iCCP chunk or a JPEG APP2 segment starting with the ICC_PROFILE identifier"
zero = "no iCCP chunk and no ICC_PROFILE APP2 segment"
accepts = ["*/*"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
