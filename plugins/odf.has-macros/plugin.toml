name = "odf.has-macros"
version = "1.0.0"
protocol = 1
question = "Does the OpenDocument package contain macros?"
one = "the package has an entry under Basic/ or Scripts/"
zero = "the package has no entry under Basic/ or Scripts/"
accepts = ["application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
