name = "pdf.uses-rc4-encryption"
version = "1.0.0"
protocol = 1
question = "Is the PDF encrypted with RC4?"
one  = "the /Encrypt dictionary has /V below 4 (absent counts as 0), or a crypt filter with /CFM /V2"
zero = "the PDF is not encrypted, or its crypt filters use AES (or none) only"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
