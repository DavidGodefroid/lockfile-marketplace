name = "pdf.has-submit-action"
version = "1.0.0"
protocol = 1
question = "Does the PDF contain a submit-form action (one that sends form data to a destination)?"
one  = "some object is a submit-form action (/S /SubmitForm)"
zero = "no submit-form action"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
