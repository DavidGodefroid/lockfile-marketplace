name = "pdf.has-named-destinations"
version = "1.0.0"
protocol = 1
question = "Does the PDF define named destinations?"
one  = "the catalog /Dests dictionary has an entry, or the /Names dictionary has a non-empty /Dests name tree; names and targets are not read"
zero = "no /Dests dictionary and no /Dests name tree, or both are empty"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
