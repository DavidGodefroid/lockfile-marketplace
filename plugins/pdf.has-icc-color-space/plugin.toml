name = "pdf.has-icc-color-space"
version = "1.0.0"
protocol = 1
question = "Does the PDF use an ICC-based colour space?"
one  = "some object holds an array whose first element is /ICCBased"
zero = "no [/ICCBased …] array anywhere in the file"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
