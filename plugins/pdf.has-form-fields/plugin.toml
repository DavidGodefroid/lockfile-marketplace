name = "pdf.has-form-fields"
version = "1.0.0"
protocol = 1
question = "Does the PDF have fillable form fields?"
one  = "some node of the AcroForm field tree has a field type (/FT, inherited) of button (Btn), text (Tx) or choice (Ch)"
zero = "no such field (no form, an empty field tree, or only signature fields)"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
