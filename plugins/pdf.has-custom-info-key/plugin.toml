name = "pdf.has-custom-info-key"
version = "1.0.0"
protocol = 1
question = "Does the PDF document information dictionary have a non-standard key?"
one  = "the document information dictionary has a key other than Title, Author, Subject, Keywords, Creator, Producer, CreationDate, ModDate and Trapped; neither the key nor its value is read beyond that"
zero = "no document information dictionary, or only standard keys in it"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
