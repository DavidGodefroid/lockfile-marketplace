name = "pdf.has-hidden-layer"
version = "1.0.0"
protocol = 1
question = "Does the PDF have a layer that is hidden by default?"
one  = "the default optional-content configuration (/OCProperties /D) lists at least one layer in its /OFF array"
zero = "no /OCProperties, or its default configuration has no /OFF array or an empty one"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
