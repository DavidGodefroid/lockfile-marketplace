name = "pdf.has-viewer-preferences"
version = "1.0.0"
protocol = 1
question = "Does the PDF set viewer preferences?"
one  = "the catalog has a non-empty /ViewerPreferences dictionary; its values are not read"
zero = "the catalog has no /ViewerPreferences entry, or an empty one"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
