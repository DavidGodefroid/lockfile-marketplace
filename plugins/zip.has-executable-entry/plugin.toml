name = "zip.has-executable-entry"
version = "1.0.0"
protocol = 1
question = "Does the ZIP archive contain an entry that is a native executable?"
one = "a file entry starts with an MZ (DOS/Windows), ELF or Mach-O signature"
zero = "no file entry starts with an MZ, ELF or Mach-O signature"
accepts = ["application/zip"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
