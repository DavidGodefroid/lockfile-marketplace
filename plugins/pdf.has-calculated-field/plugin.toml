name = "pdf.has-calculated-field"
version = "1.0.0"
protocol = 1
question = "Does the PDF form declare a field calculation order?"
one  = "the catalog's /AcroForm dictionary has a non-empty /CO array (fields whose value is calculated from others); the calculation scripts are not read"
zero = "no /AcroForm, or an /AcroForm without /CO or with an empty /CO"
accepts = ["application/pdf"]
limits = { cpu_s = 20, memory = "512MiB", timeout_s = 30 }
